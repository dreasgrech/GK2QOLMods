# GK2 Mounts cargo layout: corrections on top of the size-based cargo packer (see CargoLayout.cs).
# Embedded into the DLL at build time; a copy at BepInEx/config/GK2Mounts.cargo-layout.cfg (written by the panel's
# "Export cargo layout") overrides it. Copy that file here and rebuild to ship tuned values.
#
# [item <id>]      applies to every item of the same size class as <id> (measured box within 0.05 in every dimension):
#                  along / up / across        offsets when alone, at the bottom, or beside another item
#                  top_along / top_up / top_across   offsets when stacked on top of another item
# [pair <a>+<b>]   applies to that pair of size classes in either order:
#                  mode = auto | side | stack ; along / up / across move the second-placed item
#
# Size classes at the time of writing (27 items): log (wood); flour sack (box_flour); tall crate (box_beer,
# box_clothes_1/2, box_fabric, box_vine); body (body_corpse, body_wild_zombie); low crate (15 box_* incl. preserves);
# slab (stone, iron_ore_2h); no mesh (marble -> shown with the slab mesh, box_engineering_mechanism -> generic crate).
version = 1
[item body_corpse]
up = 0.03
across = 0.03

[item wood]
along = -0.02
up = -0.18
across = 0.03

[pair wood+wood]
mode = side

[pair body_corpse+wood]
mode = side
