# GK2 Mounts cargo layout: corrections on top of the size-based cargo packer (see CargoLayout.cs).
# Embedded into the DLL at build time. The tuning panel writes this file as you edit; rebuild to ship it.
# [item <id>] applies to every item of the same size class (measured box within 0.05).
#   along / up / across: at the bottom or beside another item (and alone, without alone_*); top_along / top_up / top_across: stacked on top.
#   alone_along / alone_up / alone_across: the only item on the cart (all three written when set, zeros included).
# [pair <a>+<b>] applies to that pair of size classes in either order: mode = auto | side (across the bed) | along (end to end) | stack; along / up / across move the second item.
#   a_* / b_*: a tuned pair, the exact place of item a and item b (along, height above the floor, across); frozen against everything but the floor.
# Exact ids win over size-class matches; among class matches the first in this file wins.
#
# Size classes at the time of writing (27 items): log (wood); flour sack (box_flour); tall crate (box_beer,
# box_clothes_1/2, box_fabric, box_vine); body (body_corpse, body_wild_zombie); low crate (15 box_* incl. preserves);
# slab (stone, iron_ore_2h); no mesh (marble -> shown with the slab mesh, box_engineering_mechanism -> generic crate).
version = 1

[item body_corpse]
up = 0.03
across = 0.03
alone_along = 0
alone_up = -0.02
alone_across = 0

[item box_flour]
along = 0.01
top_up = -0.22

[item box_vine]
along = 0.19
alone_along = 0
alone_up = 0
alone_across = 0

[item stone]
top_up = -0.14
alone_along = 0
alone_up = -0.13
alone_across = -0.02

[item wood]
along = -0.02
up = -0.09
across = 0.05
alone_along = -0.02
alone_up = -0.2
alone_across = -0.03

[pair wood+wood]
mode = side

[pair body_corpse+wood]
mode = side
a_along = 0
a_up = 0.11
a_across = 0.13
b_along = -0.02
b_up = -0.09
b_across = -0.13

[pair wood+stone]
mode = stack

[pair wood+box_vine]
mode = along

[pair wood+box_flour]
mode = stack

[pair body_corpse+iron_ore_2h]
mode = stack

[pair iron_ore_2h+box_beer]
mode = stack

[pair body_corpse+box_flour]
mode = stack
a_along = 0
a_up = -0.01
a_across = 0.03
b_along = 0
b_up = 0.19
b_across = 0.04

[pair body_corpse+body_corpse]
mode = stack
a_along = 0
a_up = 0.02
a_across = 0.03
b_along = 0
b_up = 0.24
b_across = 0.03

[pair box_appliances_1+box_appliances_1]
mode = along
a_along = 0.26
a_up = 0
a_across = 0
b_along = -0.23
b_up = 0
b_across = 0

[pair box_appliances_1+box_beer]
mode = along
a_along = 0.33
a_up = 0
a_across = 0
b_along = -0.17
b_up = 0
b_across = 0
