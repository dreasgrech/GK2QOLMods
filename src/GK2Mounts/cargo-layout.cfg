# GK2 Mounts cargo layout: corrections on top of the size-based cargo packer (see CargoLayout.cs).
# Embedded into the DLL at build time. The tuning panel writes this file as you edit; rebuild to ship it.
# [item <id>] applies to every item of the same size class (measured box within 0.05).
#   along / up / across: alone, at the bottom or beside another item; top_along / top_up / top_across: stacked on top.
# [pair <a>+<b>] applies to that pair of size classes in either order: mode = auto | side (across the bed) | along (end to end) | stack; along / up / across move the second item.
#
# Size classes at the time of writing (27 items): log (wood); flour sack (box_flour); tall crate (box_beer,
# box_clothes_1/2, box_fabric, box_vine); body (body_corpse, body_wild_zombie); low crate (15 box_* incl. preserves);
# slab (stone, iron_ore_2h); no mesh (marble -> shown with the slab mesh, box_engineering_mechanism -> generic crate).
version = 1

[item body_corpse]
up = 0.03
across = 0.03

[item box_flour]
along = 0.01
top_up = -0.22

[item box_vine]
along = 0.19

[item stone]
top_up = -0.14

[item wood]
along = -0.02
up = -0.1
across = 0.16

[pair wood+wood]
mode = side

[pair body_corpse+wood]
mode = side

[pair wood+stone]
mode = stack

[pair wood+box_vine]
mode = along

[pair wood+box_flour]
mode = stack
