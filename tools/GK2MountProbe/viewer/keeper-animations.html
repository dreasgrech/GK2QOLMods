<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper Animations</title>
<style>
  :root { --bg:#1b1d22; --panel:#262931; --text:#e6e6e6; --muted:#9aa0a8; --accent:#7fb069; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--panel); padding:10px 16px; display:flex; flex-wrap:wrap; gap:14px; align-items:center; border-bottom:1px solid #000; z-index:2; }
  header label { display:flex; gap:6px; align-items:center; color:var(--muted); }
  header select, header input[type=number] { background:#111; color:var(--text); border:1px solid #444; padding:3px 6px; }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; padding:16px; }
  .card { background:var(--panel); border-radius:6px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .card canvas { image-rendering:pixelated; image-rendering:crisp-edges; background:#3a3f49; border-radius:4px; }
  .card .name { font-family:ui-monospace, monospace; font-size:12px; color:var(--text); text-align:center; word-break:break-all; }
  .card .meta { font-size:11px; color:var(--muted); }
  .card.sel { outline:2px solid var(--accent); }
  #status { padding:8px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <label>Skin <select id="skin"></select></label>
  <label>Facing <select id="facing"><option value="left">left</option><option value="down">down</option><option value="up">up</option><option value="all">all</option></select></label>
  <label>Layers <select id="layers"><option value="full">body + arm + head + hair + beard</option><option value="bdyarm">body + arm</option><option value="bdy">body only</option><option value="arm">arm only</option></select></label>
  <label>Colours <select id="palette"><option value="on">outfit palette</option><option value="off">raw index colours</option></select></label>
  <label>Zoom <input id="zoom" type="number" min="1" max="8" value="3" style="width:50px"></label>
  <label>FPS <input id="fps" type="number" min="1" max="60" value="11" style="width:50px"></label>
  <label><input id="mirror" type="checkbox"> mirror (face right)</label>
  <label>Filter <input id="filter" type="text" placeholder="e.g. fishing" style="background:#111;color:#eee;border:1px solid #444;padding:3px 6px;width:120px"></label>
</header>
<div id="status">Loading atlases…</div>
<main id="grid"></main>
<script src="atlases-data.js"></script>
<script src="sprites-data.js"></script>
<script>
(() => {
  const ATLASES = {
    M: 'sactx-0-2048x2048-Uncompressed-MainCharacter-8554cb72.png',
    C0: 'sactx-0-2048x2048-Uncompressed-Characters-a31f6aed.png',
    C1: 'sactx-1-2048x2048-Uncompressed-Characters-a31f6aed.png',
  };
  const PALETTES = { body: 'palette_keeper_body_unnamed.png', arms: 'palette_keeper_arms_unnamed.png', hair: 'palette_keeper_hair_unnamed.png', beard: 'palette_keeper_beard_unnamed.png' };
  const FRAME = 96;
  // Draw order back→front as the game's z offsets imply: body, head, beard, hair, arm.
  const LAYER_ORDER = ['bdy', 'hed', 'brd', 'hrs', 'arm'];
  const PALETTE_FOR = { bdy: 'body', arm: 'arms', hrs: 'hair', brd: 'beard' };

  // rows: [name, atlas, x, y, w, h, frameW, frameH, offX, offY]
  const sprites = new Map();
  for (const r of window.SPRITES) sprites.set(r[0], { name: r[0], atlas: r[1], x: r[2], y: r[3], w: r[4], h: r[5], fw: r[6], fh: r[7], ox: r[8], oy: r[9] });

  // Family = name without trailing _NN. Frames sorted by number.
  const families = new Map();
  for (const s of sprites.values()) {
    const m = s.name.match(/^(.*?)(?:_(\d+))?$/);
    const fam = m[1], idx = m[2] ? parseInt(m[2], 10) : 0;
    if (!families.has(fam)) families.set(fam, []);
    families.get(fam).push({ idx, s });
  }
  for (const f of families.values()) f.sort((a, b) => a.idx - b.idx);

  const parse = fam => { // skin, layer, anim, dir
    const m = fam.match(/^(\d{4})_([a-z]+)_(.*?)(?:_(left|down|up))?$/);
    return m ? { skin: m[1], layer: m[2], anim: m[3], dir: m[4] || '' } : null;
  };

  const skins = [...new Set([...families.keys()].map(f => parse(f)?.skin).filter(Boolean))].sort();
  const skinSel = document.getElementById('skin');
  for (const sk of skins) { const o = document.createElement('option'); o.value = sk; o.textContent = sk + (sk === '9008' ? ' (your body)' : sk === '9001' ? ' (default head)' : sk === '0301' ? ' (donkey)' : sk === '9019' ? ' (armour)' : ''); skinSel.appendChild(o); }
  skinSel.value = skins.includes('9008') ? '9008' : skins[0];

  const images = {}, paletteMaps = {};
  const dataFor = (table, key, src) => (window[table] && window[table][key]) ? window[table][key] : src;
  const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(src); im.src = src; });

  // Palette texture 32x2: row 0 = index colours in the art, row 1 = outfit colours (assumption verified visually).
  const buildPaletteMap = im => {
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, im.width, im.height).data;
    const map = new Map();
    for (let x = 0; x < im.width; x++) {
      const k = (x * 4), v = ((im.height - 1) * im.width + x) * 4;
      if (d[k + 3] === 0) continue;
      map.set((d[k] << 16) | (d[k + 1] << 8) | d[k + 2], [d[v], d[v + 1], d[v + 2]]);
    }
    return map;
  };

  // Cache of recoloured sprite frames as ImageData.
  const frameCache = new Map();
  const getFrame = (s, usePalette, layer) => {
    const key = s.name + '|' + usePalette + '|' + layer;
    if (frameCache.has(key)) return frameCache.get(key);
    const im = images[s.atlas];
    const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
    const g = c.getContext('2d');
    // atlas y is from the bottom; PNG y from the top
    g.drawImage(im, s.x, im.height - s.y - s.h, s.w, s.h, 0, 0, s.w, s.h);
    if (usePalette) {
      const pal = paletteMaps[PALETTE_FOR[layer]];
      if (pal) {
        const id = g.getImageData(0, 0, s.w, s.h), d = id.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] === 0) continue;
          const rep = pal.get((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]);
          if (rep) { d[i] = rep[0]; d[i + 1] = rep[1]; d[i + 2] = rep[2]; }
        }
        g.putImageData(id, 0, 0);
      }
    }
    frameCache.set(key, c);
    return c;
  };

  const staticFor = (skin, layer, dir) => {
    // head/hair/beard static frame for a direction; head skin is 9001, beard 9002, hair 9001 for the default keeper
    const cand = [`${skin}_${layer}_static_${dir}`, `9001_${layer}_static_${dir}`, `9002_${layer}_static_${dir}`];
    for (const c of cand) { if (families.has(c)) return families.get(c)[0].s; }
    return null;
  };

  let cards = [];
  const build = () => {
    const skin = skinSel.value, facing = document.getElementById('facing').value, layersMode = document.getElementById('layers').value;
    const zoom = +document.getElementById('zoom').value, filter = document.getElementById('filter').value.trim().toLowerCase();
    const grid = document.getElementById('grid'); grid.innerHTML = ''; cards = [];
    const wantLayer = layersMode === 'arm' ? 'arm' : 'bdy';
    const fams = [...families.keys()].filter(f => { const p = parse(f); return p && p.skin === skin && p.layer === wantLayer && (facing === 'all' || p.dir === facing || p.dir === '') && (!filter || f.toLowerCase().includes(filter)); }).sort();
    for (const fam of fams) {
      const p = parse(fam);
      const frames = families.get(fam);
      const card = document.createElement('div'); card.className = 'card';
      const cv = document.createElement('canvas'); cv.width = FRAME * zoom; cv.height = FRAME * zoom;
      const name = document.createElement('div'); name.className = 'name'; name.textContent = fam;
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = frames.length + (frames.length === 1 ? ' frame' : ' frames');
      card.append(cv, name, meta); grid.appendChild(card);
      // companion layers by animation name and direction
      const layers = [];
      const push = (layer, famName) => { if (families.has(famName)) layers.push({ layer, frames: families.get(famName) }); };
      if (layersMode === 'arm') { push('arm', fam); }
      else {
        push('bdy', fam);
        if (layersMode !== 'bdy') push('arm', `${skin}_arm_${p.anim}${p.dir ? '_' + p.dir : ''}`);
        if (layersMode === 'full' && p.dir) {
          for (const L of ['hed', 'brd', 'hrs']) { const s = staticFor(skin, L, p.dir); if (s) layers.push({ layer: L, frames: [{ idx: 0, s }] }); }
        }
      }
      layers.sort((a, b) => LAYER_ORDER.indexOf(a.layer) - LAYER_ORDER.indexOf(b.layer));
      cards.push({ cv, layers, zoom });
    }
    document.getElementById('status').textContent = `${fams.length} animation families for skin ${skin} (${facing}). Frames are placed by their real offsets in the 96×96 frame; the dot marks the pivot (character position).`;
  };

  let t0 = performance.now();
  const tick = now => {
    const fps = +document.getElementById('fps').value || 11, usePalette = document.getElementById('palette').value === 'on', mirror = document.getElementById('mirror').checked;
    const frameNo = Math.floor((now - t0) / 1000 * fps);
    for (const c of cards) {
      const g = c.cv.getContext('2d'); g.imageSmoothingEnabled = false;
      g.clearRect(0, 0, c.cv.width, c.cv.height);
      g.save();
      if (mirror) { g.translate(c.cv.width, 0); g.scale(-1, 1); }
      g.scale(c.zoom, c.zoom);
      for (const L of c.layers) {
        const f = L.frames[frameNo % L.frames.length].s;
        const img = getFrame(f, usePalette, L.layer);
        // offX/offY are from the frame's bottom-left; canvas y is from the top
        g.drawImage(img, f.ox, f.fh - f.oy - f.h);
      }
      g.fillStyle = 'rgba(255,80,80,0.9)'; g.fillRect(47.5, 47.5, 1, 1);
      g.restore();
    }
    requestAnimationFrame(tick);
  };

  Promise.all(Object.entries(ATLASES).map(([k, src]) => loadImg(dataFor("ATLAS_DATA", k, src)).then(im => { images[k] = im; })))
    .then(() => Promise.all(Object.entries(PALETTES).map(([k, src]) => loadImg(dataFor("PALETTE_DATA", k, src)).then(im => { paletteMaps[k] = buildPaletteMap(im); }).catch(() => {}))))
    .then(() => { build(); requestAnimationFrame(tick); })
    .catch(err => { document.getElementById('status').textContent = 'Could not load ' + err + '. Open this file from the folder that contains the dumped atlas PNGs (BepInEx\\GK2-sprites).'; });

  for (const id of ['skin', 'facing', 'layers', 'zoom', 'filter']) document.getElementById(id).addEventListener(id === 'filter' ? 'input' : 'change', () => { frameCache.clear(); build(); });
  document.getElementById('palette').addEventListener('change', () => { frameCache.clear(); });
})();
</script>
</body>
</html>
